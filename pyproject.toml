[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whoop-py"
version = "0.1.0"
description = "Python client for the WHOOP API with OAuth 2.0 support"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Kartheek Palepu", email = "kartheekpnsn@gmail.com" }]
keywords = ["whoop", "fitness", "health", "api", "oauth", "wearable"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "authlib>=1.3.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "ipykernel>=6.29.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/kartheekpnsn/whoop-api"
Repository = "https://github.com/kartheekpnsn/whoop-api"
Issues = "https://github.com/kartheekpnsn/whoop-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/whoop_py"]
